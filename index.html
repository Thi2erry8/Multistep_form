<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <title>Multi-step Register Form | devChallenges.io</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      button {
        border: none;
      }
      a {
        text-decoration: none;
      }

      body {
        height: 100vh;
        background-image: url("./resources/blur-radial.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }
    </style>
  </head>
  <body>
    <!-- 

    Register

    Name

    Enter your name

    Email

    Example@gmail.com

    Continue

    Step 1 of 3

    Which topics you are interested in?

    Software Development

    User Experience
    
    Graphic Design

    Step 2 of 3

    Summary

    Name: Emily Johnson
    Email: emily@emilyjohnsonstl.com

    Topics:
    User Experience
    Graphic Design

    Step 3 of 3
     -->

    <form action="post">
      <div class="form-div">
        <h1>Register</h1>
        <div>
          <label for="name">name</label>
          <input
            type="text"
            name="name"
            id="name"
            placeholder="Enter your name"
          />
        </div>
        <div>
          <label for="email">email</label>
          <input
            type="text"
            name="email"
            id="name"
            placeholder="Enter your email"
          />
        </div>
      </div>

      <div class="form-div">
        <h1>Which topics are you interested in ?</h1>
        <div class="">
          <input
            type="radio"
            name="topics"
            value="Software Development"
            id=""
          />
          <label for="Software Development"></label>
        </div>

        <div class="">
          <input type="radio" name="topics" value="User Experience" id="" />
          <label for="User Experience"></label>
        </div>

        <div class="">
          <input type="radio" name="topics" value="Graphics Design" id="" />
          <label for="Graphics Design"></label>
        </div>
      </div>

      <button>Continue</button>
    </form>
  </body>
</html>
