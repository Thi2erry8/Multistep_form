<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <title>Multi-step Register Form | devChallenges.io</title>

    <!-- Police Inter pour correspondre au design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        min-height: 100vh;
        background-color: #121826;
        background-image: url("./resources/blur-radial.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #e5e7eb;
      }

      /* --- Conteneur principal (La carte) --- */
      .card {
        background-color: #212936;
        width: min(500px, 90%);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
      }

      .form-div {
        display: none;
        flex-direction: column;
        gap: 24px;
      }

      /* Affiche uniquement l'étape active */
      .form-div.active {
        display: flex;
      }

      .form-div h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #e5e7eb;
        margin-bottom: 8px;
      }

      /* --- Champs de texte (Étape 1) --- */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-group label {
        font-size: 0.85rem;
        color: #e5e7eb;
      }

      .input-group input[type="text"],
      .input-group input[type="email"] {
        width: 100%;
        padding: 14px 16px;
        background-color: transparent;
        border: 1px solid #4d5562;
        border-radius: 10px;
        color: #e5e7eb;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .input-group input:focus {
        border-color: #845eee;
      }

      .input-group input::placeholder {
        color: #4d5562;
      }

      /* --- Boutons Radio stylisés (Étape 2) --- */
      .topic-option {
        position: relative;
      }

      .topic-option input[type="radio"] {
        position: absolute;
        opacity: 0;
        cursor: pointer;
      }

      .topic-option label {
        display: block;
        padding: 16px 20px;
        background-color: #394150;
        border: 1px solid #4d5562;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: all 0.2s;
      }

      /* Style quand le radio est coché */
      .topic-option input[type="radio"]:checked + label {
        background-color: #5425af;
        border-color: #845eee;
        color: white;
      }

      /* --- Résumé (Étape 3) --- */
      .summary-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 0.95rem;
      }

      .summary-content p {
        color: #e5e7eb;
      }

      .summary-content strong {
        font-weight: 600;
        color: #e5e7eb;
      }

      .summary-topics ul {
        margin-top: 8px;
        padding-left: 20px;
        color: #e5e7eb;
      }

      .summary-topics li {
        margin-bottom: 6px;
      }

      /* --- Bouton Continue --- */
      .continue-btn {
        align-self: center;
        background-color: #5425af;
        color: white;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 12px 32px;
        border: none;
        border-radius: 24px;
        cursor: pointer;
        margin-top: 16px;
        transition: background-color 0.2s;
      }

      .continue-btn:hover {
        background-color: #845eee;
      }

      /* --- Navigation par Dots --- */
      .navigation-container {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
      }

      .step-label {
        font-size: 0.85rem;
        color: #4d5562;
        margin-right: 8px;
      }

      .dots {
        display: flex;
        gap: 12px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #845eee4d; /* Couleur avec opacité */
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .dot.active {
        background-color: #845eee;
        box-shadow: 0 0 8px #845eee;
      }
    </style>
  </head>
  <body>
    <!-- La Carte Principale -->
    <div class="card">
      <form id="registerForm">
        <!-- ÉTAPE 1 -->
        <div class="form-div active" data-step="1">
          <h1>Register</h1>

          <div class="input-group">
            <label for="name">Name</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Enter your name"
            />
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Example@gmail.com"
            />
          </div>

          <button type="button" class="continue-btn" id="btn-next-1">
            Continue
          </button>
        </div>

        <!-- ÉTAPE 2 -->
        <div class="form-div" data-step="2">
          <h1>Which topics you are interested in?</h1>

          <div class="topic-option">
            <input
              type="radio"
              name="topics"
              value="Software Development"
              id="topic-software"
            />
            <label for="topic-software">Software Development</label>
          </div>

          <div class="topic-option">
            <input
              type="radio"
              name="topics"
              value="User Experience"
              id="topic-ux"
            />
            <label for="topic-ux">User Experience</label>
          </div>

          <div class="topic-option">
            <input
              type="radio"
              name="topics"
              value="Graphic Design"
              id="topic-design"
            />
            <label for="topic-design">Graphic Design</label>
          </div>

          <button type="button" class="continue-btn" id="btn-next-2">
            Continue
          </button>
        </div>

        <!-- ÉTAPE 3 -->
        <div class="form-div" data-step="3">
          <h1>Summary</h1>

          <div class="summary-content">
            <p><strong>Name:</strong> <span id="summaryName">—</span></p>
            <p><strong>Email:</strong> <span id="summaryEmail">—</span></p>

            <div class="summary-topics">
              <p><strong>Topics:</strong></p>
              <ul id="summaryTopicsList">
                <!-- Les sujets s'injecteront ici -->
              </ul>
            </div>
          </div>

          <button type="button" class="continue-btn" id="btn-submit">
            Continue
          </button>
        </div>
      </form>
    </div>

    <!-- Navigation sous la carte -->
    <div class="navigation-container">
      <span class="step-label" id="stepLabel">Step 1 of 3</span>
      <div class="dots">
        <span class="dot active" data-step="1"></span>
        <span class="dot" data-step="2"></span>
        <span class="dot" data-step="3"></span>
      </div>
    </div>

    <script>
      const steps = document.querySelectorAll(".form-div");
      const dots = document.querySelectorAll(".dot");
      const stepLabel = document.getElementById("stepLabel");

      // Boutons
      const btnNext1 = document.getElementById("btn-next-1");
      const btnNext2 = document.getElementById("btn-next-2");
      const btnSubmit = document.getElementById("btn-submit");

      let currentStep = 1;
      const totalSteps = steps.length;

      // Fonction pour changer d'étape
      function goToStep(step) {
        currentStep = Math.min(Math.max(step, 1), totalSteps);

        // Met à jour l'affichage des formulaires
        steps.forEach((el) => {
          el.classList.toggle(
            "active",
            Number(el.dataset.step) === currentStep,
          );
        });

        // Met à jour les dots
        dots.forEach((dot) => {
          dot.classList.toggle(
            "active",
            Number(dot.dataset.step) === currentStep,
          );
        });

        // Met à jour le texte
        stepLabel.textContent = `Step ${currentStep} of ${totalSteps}`;

        // Si on arrive à l'étape 3, on génère le résumé
        if (currentStep === 3) {
          updateSummary();
        }
      }

      // Récupère les données saisies
      function getFormData() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const topicEl = document.querySelector('input[name="topics"]:checked');
        const topic = topicEl ? topicEl.value : null;

        return { name, email, topic };
      }

      // Met à jour l'étape 3 avec les données
      function updateSummary() {
        const { name, email, topic } = getFormData();

        document.getElementById("summaryName").textContent = name || "—";
        document.getElementById("summaryEmail").textContent = email || "—";

        const topicsList = document.getElementById("summaryTopicsList");
        topicsList.innerHTML = ""; // On vide la liste

        if (topic) {
          const li = document.createElement("li");
          li.textContent = topic;
          topicsList.appendChild(li);
        } else {
          const li = document.createElement("li");
          li.textContent = "—";
          topicsList.appendChild(li);
        }
      }

      // Navigation par clic sur les dots
      dots.forEach((dot) => {
        dot.addEventListener("click", () => {
          goToStep(Number(dot.dataset.step));
        });
      });

      // Bouton Continue Étape 1
      btnNext1.addEventListener("click", () => {
        const { name, email } = getFormData();
        if (!name || !email) {
          alert("Merci de remplir tous les champs.");
          return;
        }
        goToStep(2);
      });

      // Bouton Continue Étape 2
      btnNext2.addEventListener("click", () => {
        const { topic } = getFormData();
        if (!topic) {
          alert("Merci de sélectionner un sujet.");
          return;
        }
        goToStep(3);
      });

      // Bouton Continue/Submit Étape 3
      btnSubmit.addEventListener("click", () => {
        alert("Formulaire validé avec succès !");
        // Ici tu mettras ton code d'envoi vers un serveur (fetch)
      });
    </script>
  </body>
</html>
